[package]
authors = ["Mikhail Kviatkovskii <mikhail.kviatkovskii@pm.me>"]
description = "File-based chemical search engine on Rust"
edition = "2021"
homepage = "https://github.com/mkviatkovskii/ringo"
keywords = ["cheminformatics", "smiles", "fingerprint", "search", "rust"]
license = "Apache-2.0"
name = "ringo"
readme = "README.md"
repository = "https://github.com/mkviatkovskii/ringo.git"
version = "0.1.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fixedbitset = "0.5.7"
memmap2 = "0.9.12"
petgraph = "0.8.3"
rayon = "1.12.0"
winnow = "1.0.5"

[lib]
name = "ringo"
path = "src/lib.rs"

[[bin]]
name = "ringo-index"
path = "src/bin/ringo_index.rs"

[[bin]]
name = "ringo-search"
path = "src/bin/ringo_search.rs"

[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# docs-only pedantic lints; noise for a crate this size
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# a panic outside tests should be a deliberate panic! or assert! on an invariant
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# an allowed lint must say why
allow_attributes_without_reason = "warn"
